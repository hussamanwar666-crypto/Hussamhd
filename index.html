<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسام شبكتي</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: center;
        }
        .profile-container {
            margin-bottom: 10px;
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 2px solid #38bdf8;
        }
        #clock {
            font-size: 16px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 25px;
            margin-top: 5px;
        }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: right;
        }
        .app-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #334155;
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .app-icon {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #334155;
        }
        .app-details {
            flex-grow: 1;
        }
        .app-title {
            font-size: 17px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        .app-sub {
            font-size: 13px;
            color: #94a3b8;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .download-btn, .player-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .download-btn {
            background-color: #16a34a;
        }
        .download-btn:hover {
            background-color: #15803d;
        }
        .player-btn {
            background-color: #2563eb;
        }
        .player-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
