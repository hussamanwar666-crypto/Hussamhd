<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسام شبكتي</title>
    <style>
        :root {
            --bg-main: #0b0f14;
            --bg-card: #121821;
            --bg-input: #141b24;
            --border-color: #242f3d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #16a34a;
            --accent-green-hover: #15803d;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* الترويسة: الصورة + الاسم + الساعة */
        .top-header {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            background-color: #1f2937;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .site-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .site-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .clock-box {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 14px;
            text-align: center;
            min-width: 125px;
        }

        #live-clock {
            font-size: 1rem;
            font-weight: 700;
            color: #4ade80;
            direction: ltr;
        }

        #live-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* البحث والفلاتر */
        .search-box {
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-green);
        }

        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .filter-btn.active {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: #ffffff;
            font-weight: 700;
        }

        /* شبكة البطاقات */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .app-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .app-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .app-main {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .app-badge-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.82rem;
            color: #ffffff;
            flex-shrink: 0;
            text-align: center;
            padding: 4px;
            overflow: hidden;
        }

        .app-badge-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .app-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .app-category {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .app-version {
            background-color: rgba(22, 163, 74, 0.15);
            color: #4ade80;
            border: 1px solid rgba(22, 163, 74, 0.35);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .download-btn, .player-btn {
            flex: 1;
            display: block;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            padding: 11px;
            border-radius: 10px;
            font-size: 0.92rem;
        }

        .download-btn {
            background-color: var(--accent-green);
        }

        .download-btn:hover {
            background-color: var(--accent-green-hover);
        }

        .player-btn {
            background-color: var(--accent-blue);
        }

        .player-btn:hover {
            background-color: var(--accent-blue-hover);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 32px 16px;
            display: none;
        }
    </style>
</head>

        const appsGridEl = document.getElementById("apps-grid");
        const searchInputEl = document.getElementById("search-input");
        const filterButtons = document.querySelectorAll(".filter-btn");
        const emptyStateEl = document.getElementById("empty-state");

        let currentFilter = "الكل";

        function renderApps() {
            const query = searchInputEl.value.trim().toLowerCase();
            appsGridEl.innerHTML = "";

            const filtered = appsData.filter(app => {
                const matchesCategory = currentFilter === "الكل" || app.category === currentFilter;
                const matchesSearch =
                    app.name.toLowerCase().includes(query) ||
                    app.category.toLowerCase().includes(query) ||
                    app.note.toLowerCase().includes(query) ||
                    app.version.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                emptyStateEl.style.display = "block";
                return;
            }

            emptyStateEl.style.display = "none";

            filtered.forEach(app => {
                const card = document.createElement("div");
                card.className = "app-card";

                const iconContent = app.iconImg
                    ? `<img src="${app.iconImg}" alt="${app.name}">`
                    : app.name;

                const playerBtnHtml = app.playerUrl
                    ? `<a href="${app.playerUrl}" target="_blank" rel="noopener noreferrer" class="player-btn">المشغل</a>`
                    : "";

                card.innerHTML = `
                    <div class="app-top">
                        <div class="app-main">
                            <div class="app-badge-icon" style="background-color: ${app.color};">${iconContent}</div>
                            <div>
                                <div class="app-name">${app.name}</div>
                                <div class="app-category">${app.category} • ${app.note}</div>
                            </div>
                        </div>
                        <span class="app-version">${app.version}</span>
                    </div>
                    <div class="btn-group">
                        <a href="${app.url}" target="_blank" rel="noopener noreferrer" class="download-btn">تحميل APK</a>
                        ${playerBtnHtml}
                    </div>
                `;
                appsGridEl.appendChild(card);
            });
        }

        searchInputEl.addEventListener("input", renderApps);

        filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                filterButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.dataset.filter;
                renderApps();
            });
        });

        function updateClock() {
            const now = new Date();
            document.getElementById("live-clock").textContent = now.toLocaleTimeString("ar-IQ", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
            document.getElementById("live-date").textContent = now.toLocaleDateString("ar-IQ", {
                weekday: "short",
                day: "numeric",
                month: "short"
            });
        }

        renderApps();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
